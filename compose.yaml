# The services the backend needs while you develop. The API itself still runs on your
# machine (uvicorn), so code reloads instantly.
#
#   docker compose up -d --wait   start everything, wait until each one is healthy
#   docker compose ps             what's running
#   docker compose logs -f redis  follow one service's logs
#   docker compose down           stop everything (data is kept)
#   docker compose down -v        stop everything AND delete all data (database, files)
#
# Every port is bound to 127.0.0.1, so only this machine can reach these services,
# not other devices on your Wi-Fi.

name: learnhub

services:
  # The database. The same image the tests use, so dev and tests run the same Postgres,
  # with pgvector ready for the AI phase. Host port 5433, because Homebrew Postgres
  # already uses 5432.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhub
      POSTGRES_DB: learnhub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub -d learnhub"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Fast in-memory storage: rate limits, cached access checks, live-chat fan-out.
  # Nothing in it has to survive a restart, so it has no volume.
  redis:
    image: redis:8.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The job queue. The API puts a job here ("send this email", "convert this video")
  # and answers the user straight away; the Celery worker picks the job up and does it.
  # Watch the queues in a browser at http://localhost:15672 (user/password: learnhub).
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: learnhub
      RABBITMQ_DEFAULT_PASS: learnhub
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # File storage that speaks the same S3 API as Amazon S3, so the same code works in
  # production. Videos, thumbnails and course materials will live here (Phase 3).
  # Browse the files at http://localhost:9001/rustfs/console/
  # (user: learnhub, password: learnhub-secret).
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: learnhub
      RUSTFS_SECRET_KEY: learnhub-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Every time RustFS starts, Compose runs this inside it to create the "learnhub"
    # bucket: wait until RustFS answers, ask whether the bucket exists (HEAD), and
    # create it (PUT) only if it doesn't. curl signs the requests with the S3 login.
    post_start:
      - command:
          - sh
          - -c
          - |
            until curl -fs -o /dev/null http://localhost:9000/health; do sleep 1; done
            curl -fs -o /dev/null -I --aws-sigv4 aws:amz:us-east-1:s3 --user learnhub:learnhub-secret http://localhost:9000/learnhub ||
            curl -fsS -o /dev/null -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user learnhub:learnhub-secret http://localhost:9000/learnhub

  # A pretend mail server. The app sends email to SMTP port 1025, and nothing leaves
  # your machine: read every message at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- The backend itself, in containers (optional) ----------------------------------
  # Day to day, run uvicorn and the worker on your machine (code reloads instantly).
  # These three only start with the "app" profile, e.g. to try the Docker image:
  #
  #   docker compose --profile app up -d --wait --build
  #
  # Inside Docker, services reach each other by service name (postgres, redis, ...),
  # not localhost, so these settings override the defaults in config.py.

  # A one-off job: brings the database up to the latest migration, then exits.
  migrate:
    profiles: ["app"]
    build: ./backend
    image: learnhub-backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-settings # "&" names this block so the others can reuse it
      DATABASE_URL: postgresql+asyncpg://learnhub:learnhub@postgres:5432/learnhub
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://learnhub:learnhub@rabbitmq:5672//
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: ./backend
    image: learnhub-backend
    environment: *backend-settings # the same settings as migrate
    ports:
      # API_PORT=8001 docker compose ... if your own uvicorn already uses 8000.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    profiles: ["app"]
    build: ./backend
    image: learnhub-backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
    environment: *backend-settings
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  s3-data:
